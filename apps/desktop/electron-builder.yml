# The installers: the desktop build packaged with its own Electron.
# scripts/package-linux.mjs stages the app directory and runs this for
# the host's architecture only, so each package carries that
# architecture's node-pty and beam binary.
appId: is.n10.desktop
productName: n10
# Not `n10`, which is the npm package's command (`n10 --tui`, `n10 util`).
executableName: n10-desktop
copyright: Copyright © 2026 Hermann Björgvin
directories:
  app: dist/installer-app
  output: dist/installers
  buildResources: build
# node-pty is N-API, built by the staging install, and loads in
# Electron as it is; beam is a Go binary.
npmRebuild: false
asar: true
# Run by other processes, which cannot read inside the archive: node-pty's
# addon, and beam, which sessions reach through a symlink.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@notaharness/beam-*/**
linux:
  target:
    - deb
    - AppImage
  icon: build/icons
  category: Development
  synopsis: Coding agents in git worktrees, and reviews of their pull requests
  maintainer: Hermann Björgvin <hermann@hermann.is>
  artifactName: ${productName}-${version}-${arch}.${ext}
  syncDesktopName: true
deb:
  # electron-builder's defaults, which setting depends replaces, then
  # the ALSA library Electron links, which minimal systems lack (named
  # first, so apt does not pick an ALSA emulation), and what n10 runs.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - tmux
    - git
