name: Release

# A vX.Y.Z tag releases X.Y.Z, which must be apps/cli/package.json's
# version: it packs and tests the package (package.yml), publishes that
# tarball to npm through trusted publishing, and creates the GitHub release.
# Run by hand, it rehearses the release of the selected ref's version:
# everything but the GitHub release, and npm publish with --dry-run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/cli/package.json's $version"
            exit 1
          fi
          echo "prerelease=$([[ $version == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml

  # Its own job, so a GitHub release that fails after publishing can be
  # re-run alone. Trusted publishing authenticates `npm publish` and nothing
  # else, so `latest` is the one dist-tag a release sets.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5.1 or later publishes through trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - run: npm publish --provenance --tag latest package/*.tgz
        env:
          npm_config_dry_run: ${{ github.event_name == 'workflow_dispatch' }}

  # Release assets are the artifacts named release-*. The Linux package jobs
  # (#122) join `needs` and upload their .deb and AppImage under that prefix.
  github-release:
    if: github.event_name == 'push'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - run: |
          mapfile -t assets < <(find assets -type f 2>/dev/null)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --prerelease="$PRERELEASE" "${assets[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
